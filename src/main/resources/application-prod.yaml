spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    # The standard location for your production migrations.
    locations: classpath:db/migration
    # Enable streaming mode to handle the 152MB seed file without memory issues.
    stream: true

  jpa:
    hibernate:
      ddl-auto: validate   # This creates tables from entities
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    open-in-view: false
    #defer-datasource-initialization: true  # Wait for JPA to create tables first
  
  sql:
    init:
      mode: never
      #data-locations: classpath:data_prod.sql
      #continue-on-error: true   
      #platform: postgresql  # Add this!

  transaction:
    default-timeout: 90  # Transaction timeout in seconds
    rollback-on-commit-failure: true  # Rollback transaction if commit failsn

server:
  port: ${PORT:8080}